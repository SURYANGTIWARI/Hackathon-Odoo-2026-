<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>
    <style>
        .logo{
            width: 300px;
            height: 300px;
            display: block;
            margin: 0px auto;
            position: relative;
        }
        .Button{
            background-color:black;
            color: white;
            height: 40px;
            width: 400px;
        
        }
        header{
          background-color: rgb(255, 254, 253);
          margin-bottom: 20px;
            position:relative;
   padding: 10px;
            display: flex;
    justify-content: space-between;
            

        }
        section{
            background-color: rgb(255, 254, 252);
            border-radius: 10px;
            padding: 20px;
            width: 500px;
            margin: 0px auto;
        }
        .main{
            display: flex;
            flex-direction: column;
            align-items: center;
          
        }
        body{
            background-color: rgb(164, 162, 160);
        }
        .product{
            background-color: rgb(255, 254, 253);
            border-radius: 10px;
            width: 400px;

        }
        button:hover{
            background-color: rgb(94, 202, 208);
            color: black;
            border: 1px solid black;
        }
        .discount{
            background-color: rgb(255, 0, 0);
            width: 100px;
            position: absolute;
right: 190px;
            
            color: white;
            text-align: center;
            border-radius: 5px;
           
        }
        .cart-count {
            position: absolute;
            right: 0px;
            bottom: 50px;
            background-color: red;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    </style>
</head>
<body>
    <header>
  
        <div><h2>ShopEasy</h2></div>      <div class="cart-count">3</div><h2>🛒</h2>

        
    </header>
    <section >
        <div class="discount">20% OFF</div>
        <div style="background-color:rgb(220, 218, 215); border-radius: 40px;"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPNY9X-Fg-o6t7h8Cf39S7jAWjmVyFUu-p7YzhSfuSyg&s" alt="ShopEasy Logo" title="ShopEasy Logo" class="logo"></div>
        


    <main class="main">
        <div class="product">
        <div><h2><b>Running Shoes</b></h2></div>
        <h4>Comfortable shoes for everyday</h4>
        <h4>running.</h4>
        <h3><b>₹ 1,999.00</b></h3><br><br></div>
        <button class="Button">Add to Cart</button>
    </main>
        </section>
</body>
</html>
